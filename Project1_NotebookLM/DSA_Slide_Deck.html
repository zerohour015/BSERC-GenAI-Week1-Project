<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSA Exam Kit — Slide Deck</title><style>
:root{--bg:#101a2e;--panel:#1e2d4c;--text:#f3f6ff;--muted:#bac8e4;--accent:#7a9bff;--line:#344766}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.6 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.deck{width:min(1100px,96vw);height:min(680px,88vh);min-height:420px;background:linear-gradient(145deg,#1a2a49,#101a2e);border:1px solid var(--line);border-radius:26px;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;box-shadow:0 24px 80px #0006}.kicker{color:#90aaff;text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;font-weight:800}.title{font-size:clamp(2rem,5.5vw,4.4rem);line-height:1.08;margin:16px 0 24px}.body{font-size:clamp(1.05rem,2.2vw,1.55rem);white-space:pre-line;flex:1}.subtitle{color:var(--muted);font-size:1rem;border-top:1px solid var(--line);padding-top:18px}.controls{display:flex;align-items:center;gap:12px;margin-top:18px}.controls button{background:#2b3f65;color:white;border:1px solid #52698f;border-radius:12px;padding:10px 18px;font:inherit;cursor:pointer}.controls button:hover{border-color:var(--accent)}.counter{margin-left:auto;color:var(--muted);font-size:.9rem}.bar{height:5px;background:#263754;border-radius:9px;overflow:hidden;margin-top:14px}.bar span{height:100%;display:block;background:var(--accent);width:12.5%;transition:width .2s}@media(max-width:600px){body{padding:8px}.deck{height:90vh;padding:22px;border-radius:18px}.controls{gap:6px}.controls button{padding:9px 12px}.counter{font-size:.8rem}}@media print{body{display:block;padding:0;background:white}.deck{width:100%;height:100vh;page-break-after:always;border-radius:0;box-shadow:none}}
</style></head><body><main class="deck" aria-live="polite"><div class="kicker">BSERC · Project 1 · Source-grounded DSA</div><h1 class="title" id="title"></h1><div class="body" id="body"></div><div class="subtitle" id="subtitle"></div><div class="controls"><button id="prev">← Previous</button><button id="next">Next →</button><span class="counter" id="counter"></span></div><div class="bar"><span id="progress"></span></div></main><script>
const slides=[["DSA Exam Kit", "Sorting, algorithm analysis and binary search trees", "BSERC GenAI Internship · Project 1"], ["Learning map", "Insertion sort: sorted prefix and repeated insertion.\nMerge sort: divide, recursively sort and merge.\nBST: ordered nodes and path-based operations.", "Three connected ideas"], ["Insertion sort", "Keep the processed prefix sorted.\nTake the next key and insert it in the correct position.\nThe MIT lecture's reverse-ordered worst case has Θ(n²) comparisons and swaps.", "MIT 6.006 Lecture 03 · pp. 5, 16"], ["Merge sort", "1. Divide the array into two halves.\n2. Recursively sort each half.\n3. Merge the two sorted halves.", "MIT 6.006 Lecture 03 · p. 18"], ["Merge cost and recurrence", "A merge processes n total elements in Θ(n).\nT(1) = Θ(1)\nT(n) = 2T(n/2) + Θ(n)\nTotal running time: Θ(n log n).", "MIT 6.006 Lecture 03 · pp. 31–42"], ["BST ordering invariant", "For a node x, every key in its left subtree is ≤ key(x).\nEvery key in its right subtree is ≥ key(x).", "MIT 6.006 Lecture 05 · p. 4"], ["BST operations and height", "insert(value): follow links to an insertion location.\nfind(value): follow links until found or NIL.\nfindmin(): keep following left links.\nnext-larger(node): right-subtree minimum or ancestor path.\nCore operations cost O(h), where h is tree height.", "MIT 6.006 Lecture 05 · pp. 4–7"], ["Quick knowledge check", "1. Why is reverse-order insertion sort quadratic?\n2. Write merge sort's recurrence.\n3. Why should you not assume every BST operation is O(log n)?", "Open the source citations and verify each answer."]];let index=0;function show(){const s=slides[index];document.getElementById('title').textContent=s[0];document.getElementById('body').textContent=s[1];document.getElementById('subtitle').textContent=s[2];document.getElementById('counter').textContent=`${index+1} / ${slides.length}`;document.getElementById('progress').style.width=((index+1)/slides.length*100)+'%';document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===slides.length-1?'Restart ↺':'Next →'}function next(){index=index===slides.length-1?0:index+1;show()}function prev(){index=Math.max(0,index-1);show()}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){prev()}});show();</script></body></html>
